<style>
:root{--bg:#E9E7E0;--panel:#FFFFFF;--text:#0E2F3E;--muted:#4A5C66;--line:#D6DBD7;--chip:#ECEEE9;--bad:#A61B1B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11191D;--panel:#1A252B;--text:#E7ECEE;--muted:#A9B6BC;--line:#2E3B42;--chip:#25323A;--bad:#FF8A80}}
:root[data-theme="dark"]{--bg:#11191D;--panel:#1A252B;--text:#E7ECEE;--muted:#A9B6BC;--line:#2E3B42;--chip:#25323A;--bad:#FF8A80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:17px;font-weight:700;flex:1 1 220px}
nav{display:flex;flex-wrap:wrap;gap:6px}
button,select{font:inherit;color:var(--text);background:var(--chip);border:1px solid var(--line);border-radius:8px;min-height:36px;padding:0 12px;cursor:pointer}
button[aria-selected="true"]{background:var(--text);color:var(--panel);border-color:var(--text)}
main{padding:16px}
h2{margin:28px 0 12px;font-size:15px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.thumb{display:flex;flex-direction:column;gap:6px;max-width:100%}
.frame{position:relative;overflow:hidden;border:1px solid var(--line);background:#fff;padding:0;border-radius:4px;max-width:100%}
.frame iframe{border:0;transform-origin:0 0;pointer-events:none;display:block}
.cap{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.bad{color:var(--bad);font-weight:700}
dialog{width:min(96vw,1700px);max-height:94vh;padding:0;border:1px solid var(--line);background:var(--panel);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg-head{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.dlg-head b{flex:1}
.dlg-body{overflow:auto;max-height:calc(94vh - 58px)}
textarea{width:100%;min-height:220px;font:12px/1.4 ui-monospace,monospace;background:var(--bg);color:var(--text);border:1px solid var(--line);padding:10px}
.pad{padding:14px;display:flex;flex-direction:column;gap:10px}
</style>
</head>

imbing class from the app; the front desk runs the week on the web; coaches take attendance on their phone. Six stories make it usable, nine make it complete.<\/p>\n<\/header>\n<section style=\"display: flex; gap: 72px; align-items: flex-end;\"><div><div class=\"serif tnum\" style=\"font-size: 56px; line-height: 1;\">4<\/div><div class=\"muted\" style=\"font-size: 14px; margin-top: 6px;\">stages<\/div><\/div><div><div class=\"serif tnum\" style=\"font-size: 56px; line-height: 1;\">10<\/div><div class=\"muted\" style=\"font-size: 14px; margin-top: 6px;\">user stories<\/div><\/div><div><div class=\"serif tnum\" style=\"font-size: 56px; line-height: 1;\">5<\/div><div class=\"muted\" style=\"font-size: 14px; margin-top: 6px;\">screens<\/div><\/div><div><div class=\"serif tnum\" style=\"font-size: 56px; line-height: 1;\">2<\/div><div class=\"muted\" style=\"font-size: 14px; margin-top: 6px;\">user flows<\/div><\/div><div><div class=\"serif tnum\" style=\"font-size: 56px; line-height: 1;\">5<\/div><div class=\"muted\" style=\"font-size: 14px; margin-top: 6px;\">decisions<\/div><\/div><div style=\"flex-grow: 1;\"><\/div><span class=\"chip chip-ok\">No open decisions<\/span><\/section>\n<div class=\"hr\"><\/div>\n<section style=\"display: flex; flex-direction: column; gap: 14px;\"><div class=\"eyebrow\">Who it is for · the sample world, now = Mon 12 Oct 2026, 9:15 AM<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px;\"><div class=\"card\" style=\"padding: 18px; display: flex; flex-direction: column; gap: 8px;\">\n  <div style=\"display: flex; align-items: center; gap: 10px;\"><span class=\"av\">DR<\/span><div><div class=\"b\" style=\"font-size: 16px;\">Dana Reyes<\/div><div class=\"muted\" style=\"font-size: 13px;\">Gym owner<\/div><\/div><\/div>\n  <p style=\"font-size: 13.5px; line-height: 1.5; color: #33454E;\">Sets class types and prices, and reads how full the week is.<\/p>\n  <div style=\"display: flex; gap: 4px; flex-wrap: wrap;\"><span class=\"chip\"><span class=\"dot\" style=\"background: #0E2F3E;\"><\/span>Web<\/span><\/div>\n<\/div><div class=\"card\" style=\"padding: 18px; display: flex; flex-direction: column; gap: 8px;\">\n  <div style=\"display: flex; align-items: center; gap: 10px;\"><span class=\"av\">LP<\/span><div><div class=\"b\" style=\"font-size: 16px;\">Leo Park<\/div><div class=\"muted\" style=\"font-size: 13px;\">Front desk<\/div><\/div><\/div>\n  <p style=\"font-size: 13.5px; line-height: 1.5; color: #33454E;\">Publishes the week&#x27;s classes, books members in by phone and checks them in.<\/p>\n  <div style=\"display: flex; gap: 4px; flex-wrap: wrap;\"><span class=\"chip\"><span class=\"dot\" style=\"background: #0E2F3E;\"><\/span>Web<\/span><\/div>\n<\/div><div class=\"card\" style=\"padding: 18px; display: flex; flex-direction: column; gap: 8px;\">\n  <div style=\"display: flex; align-items: center; gap: 10px;\"><span class=\"av\">MC<\/span><div><div class=\"b\" style=\"font-size: 16px;\">Maya Chen<\/div><div class=\"muted\" style=\"font-size: 13px;\">Coach<\/div><\/div><\/div>\n  <p style=\"font-size: 13.5px; line-height: 1.5; color: #33454E;\">Sees today&#x27;s classes and their rosters; marks who came.<\/p>\n  <div style=\"display: flex; gap: 4px; flex-wrap: wrap;\"><span class=\"chip\"><span class=\"dot\" style=\"background: #8FA123;\"><\/span>App<\/span><\/div>\n<\/div><div class=\"card\" style=\"padding: 18px; display: flex; flex-direction: column; gap: 8px;\">\n  <div style=\"display: flex; align-items: center; gap: 10px;\"><span class=\"av\">SO<\/span><div><div class=\"b\" style=\"font-size: 16px;\">Sam Okafor<\/div><div class=\"muted\" style=\"font-size: 13px;\">Member<\/div><\/div><\/div>\n  <p style=\"font-size: 13.5px; line-height: 1.5; color: #33454E;\">Finds a class that fits, books a place and cancels in time if plans change.<\/p>\n  <div style=\"display: flex; gap: 4px; flex-wrap: wrap;\"><span class=\"chip\"><span class=\"dot\" style=\"background: #8FA123;\"><\/span>App<\/span><\/div>\n<\/div><\/div><\/section>\n<section class=\"card\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 12px;\"><div class=\"eyebrow\">How to read this canvas<\/div><ul style=\"display: flex; flex-direction: column; gap: 10px;\"><li style=\"display: flex; gap: 12px; font-size: 14px; line-height: 1.5;\"><span class=\"chip chip-ink\" style=\"flex: none;\">Overview<\/span><span>The model, who can do what, journeys, states and every decision taken.<\/span><\/li><li style=\"display: flex; gap: 12px; font-size: 14px; line-height: 1.5;\"><span class=\"chip chip-ink\" style=\"flex: none;\">User flows<\/span><span>One board per role: each lane is a job they do, step by step.<\/span><\/li><li style=\"display: flex; gap: 12px; font-size: 14px; line-height: 1.5;\"><span class=\"chip chip-ink\" style=\"flex: none;\">Web · front desk<\/span><span>Annotated wireframes: W01–W02.<\/span><\/li><li style=\"display: flex; gap: 12px; font-size: 14px; line-height: 1.5;\"><span class=\"chip chip-ink\" style=\"flex: none;\">Mobile · member and coach<\/span><span>Annotated wireframes: M01–M03.<\/span><\/li><li style=\"display: flex; gap: 12px; font-size: 14px; line-height: 1.5;\"><span class=\"chip chip-ink\" style=\"flex: none;\">User stories<\/span><span>The roadmap, then one board per stage with its stories and acceptance points.<\/span><\/li><\/ul>\n<p class=\"help\">Every step in a flow names its screen and story (W01 · B1.1); every wireframe lists its stories; every story card lists its decisions (#n).<\/p><\/section>\n<\/div>\n<\/body><\/html>"}, {"file": "O1-Model.dc.html", "title": "Model", "page": "Overview & model", "row": "Overview", "w": 1640, "h": 500, "doc": "<!doctype html><html><head><meta charset=\"utf-8\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif&amp;family=Inter:wght@400;500;600;700&amp;display=swap\">\n<style>\nbody{margin:0;background:#E9E7E0;font-family:'Int he gym teaches, with its level, length and price.<\/p>\n  <ul style=\"display: flex; flex-direction: column; gap: 8px;\"><li style=\"display: flex; gap: 8px; font-size: 13.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>Intro to Bouldering · Beginner · 60 min · 18 USD<\/span><\/li><li style=\"display: flex; gap: 8px; font-size: 13.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>Owner-only to create or reprice<\/span><\/li><\/ul>\n  <div style=\"display: flex; gap: 8px; font-size: 13.5px; font-weight: 600;\"><span class=\"muted\">→<\/span><span>Has many classes<\/span><\/div>\n<\/article><article class=\"card\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 12px;\">\n  <h2 class=\"serif\" style=\"font-size: 30px; line-height: 1.1;\">Class<\/h2>\n  <p style=\"font-size: 15px; line-height: 1.5; color: #33454E;\">One dated meeting of a class type, with a coach, a wall and a capacity.<\/p>\n  <ul style=\"display: flex; flex-direction: column; gap: 8px;\"><li style=\"display: flex; gap: 8px; font-size: 13.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>Capacity is a hard cap; the waitlist is separate<\/span><\/li><li style=\"display: flex; gap: 8px; font-size: 13.5px; line-height: 1.45;\"><svg width=\"14\" height=  aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"M20 20l-4-4\"><\/path><\/svg><input id=\"find-member\" type=\"search\" value=\"Nair\" placeholder=\"Name or phone\"><\/div>\n<\/div>\n<fieldset style=\"border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0;\">\n<legend class=\"eyebrow\" style=\"padding: 0; margin-bottom: 8px;\">2 matches · 2 picked<\/legend>\n<div class=\"card\">\n<label class=\"pick\" style=\"border-bottom: 1px solid #E3E6E1;\"><input type=\"checkbox\" checked style=\"width: 18px; height: 18px; accent-color: #0E2F3E;\"><span class=\"av av-sm\" aria-hidden=\"true\">PN<\/span><span style=\"flex: 1;\"><b style=\"font-size: 13px;\">Priya Nair<\/b><br><span class=\"help\">Member · 555-0142<\/span><\/span><\/label>\n<label class=\"pick\"><input type=\"checkbox\" checked style=\"width: 18px; height: 18px; accent-color: #0E2F3E;\"><span class=\"av av-sm\" aria-hidden=\"true\">DN<\/span><span style=\"flex: 1;\"><b style=\"font-size: 13px;\">Dev Nair<\/b><br><span class=\"help\">Member · 555-0187<\/span><\/span><\/label>\n<\/div>\n<\/fieldset>\n<div class=\"rel\" style=\"display: flex; flex-direction: column; gap: 12px; padding: 14px; background: #FFF1D6; border: 1px solid #F0C66E;\">\n<span class=\"mk mka\">3<\/span>\n<p style=\"font-size: 13px; line-height: 1.45; color: #6E4300;\"><b>2 places takes the class to 11 of 10.<\/b> One booking goes over capacity, so the desk records why.<\/p>\n<div>\n<label class=\"lbl\" for=\"over-reason\" style=\"color: #6E4300;\">Reason for going over capacity (required)<\/label>\n<textarea id=\"over-reason\" rows=\"3\" style=\"width: 100%; resize: none; padding: 8px 10px; border: 1px solid #C3CBC7; background: #fff; font: inherit; font-size: 13px; color: #0E2F3E;\">Priya and Dev only climb as a pair.<\/textarea>\n<\/div>\n<\/div>\n<\/div>\n<div style=\"flex: none; display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid #D6DBD7;\">\n<button class=\"btn\" type=\"button\">Cancel<\/button>\n<span class=\"rel\"><span class=\"mk mka\">5<\/span><button class=\"btn btn-ink\" type=\"button\">Book 2 places<\/button><\/span>\n<\/div>\n<\/section>\n<\/div>\n<\/div>\n<aside class=\"notes\">\n<div class=\"eyebrow\">Web · Front desk<\/div>\n<h1>Class roster and check-in<\/h1>\n<p class=\"lead\">Leo books Priya and Dev Nair by phone into Wednesday's intro class, one place from full, and ticks the roster at the door on the day.<\/p>\n<div class=\"hr\"><\/div>\n<ol>\n<li><span class=\"mk\">1<\/span><div><b>Two marks, no default.<\/b> Nobody is pre-marked Came, so an unmarked row means \"not checked yet\"; Maya's app reads the same marks (B1.4).<\/div><\/li>\n<li><span class=\"mk\">2<\/span><div><b>One box for name or phone.<\/b> The caller is on the line; Leo types whichever they give first, and the desk books on their behalf (B2.2).<\/div><\/li>\n<li><span class=\"mk\">3<\/span><div><b>Over the cap takes a reason.<\/b> Members stop at 10 in the app; the desk may go over, and the reason is kept with the booking (#1).<\/div><\/li>\n<li><span class=\"mk\">4<\/span><div><b>Who booked is on the roster.<\/b> App or desk with initials, so a disputed phone booking has an answer.<\/div><\/li>\n<li><span class=\"mk\">5<\/span><div><b>The button counts.<\/b> \"Book 2 places\" says what will happen, as Publish does on the schedule.<\/div><\/li>\n<\/ol>\n<div class=\"hr\"><\/div>\n<div class=\"eyebrow\">Stories<\/div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px;\"><span class=\"chip\">B1.4<\/span><span class=\"chip\">B2.2<\/span><\/div>\n<div class=\"eyebrow\">Next<\/div>\n<p class=\"help\">→ M01 Classes this week<\/p>\n<\/aside>\n\n<\/div>\n<\/body><\/html>"}, {"file": "M01-Classes.dc.html", "title": "M01 · Classes this week", "page": "Mobile · member and coach", "row": "M01–M03", "w": 800, "h": 1020, "doc": "<!doctype html><html><head><meta charset=\"utf-8\">\n<link rel=\"stylesheet\" href=\"https://fonts.googlea r<\/p><\/div>\n<\/header>\n<main class=\"scroll\" style=\"gap: 12px;\">\n<h3 class=\"eyebrow\" style=\"display: flex; align-items: center; gap: 6px; margin-top: 8px;\">Upcoming <span class=\"mk\">1<\/span><\/h3>\n<article class=\"card\" style=\"padding: 14px; display: flex; flex-direction: column; gap: 12px;\">\n<div class=\"row\" style=\"align-items: flex-start;\">\n<div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;\">\n<p class=\"sub tnum\" style=\"font-weight: 600; color: #0E2F3E;\">Wed 14 Oct · 6:00–7:00 PM<\/p>\n<h4 style=\"font-size: 16px; font-weight: 600;\"><a href=\"#\" style=\"text-decoration: none;\">Intro to Bouldering<\/a><\/h4>\n<p class=\"sub\">Maya Chen · Wall B · 18 USD at the desk<\/p>\n<\/div>\n<span class=\"chip chip-ok\">Booked<\/span>\n<\/div>\n<div class=\"rel row\" style=\"gap: 8px;\">\n<span class=\"mk mka\">3<\/span>\n<svg class=\"i\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9\"><\/path><path d=\"M10.3 21a1.9 1.9 0 003.4 0\"><\/path><\/svg>\n<p class=\"sub\">Reminder at 4:00 PM on Wednesday<\/p>\n<\/div>\n<div class=\"hr\"><\/div>\n<div class=\"rel\" style=\"display: flex; flex-direction: column; gap: 10px;\">\n<span class=\"mk mka\">2<\/span>\n<div class=\"accent-soft\" style=\"display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px;\">\n<svg class=\"i\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 7v5l3 2\"><\/path><\/svg>\n<p style=\"font-size: 14px; line-height: 1.45;\">Free to cancel until <b>Wed 6:00 AM<\/b>. After that the booking counts as a No-show.<\/p>\n<\/div>\n<button type=\"button\" class=\"btn btn-danger\" style=\"width: 100%;\">Cancel booking<\/button>\n<\/div>\n<\/article>\n<h3 class=\"eyebrow\" style=\"margin-top: 10px;\">Past<\/h3>\n<article class=\"card rel\" style=\"padding: 14px;\">\n<span  · Member<\/div>\n<h1>My bookings<\/h1>\n<p class=\"lead\">Sam checks where he is due on Wednesday and how long he can still cancel for free.<\/p>\n<div class=\"hr\"><\/div>\n<ol>\n<li><span class=\"mk\">1<\/span><div><b>Upcoming first.<\/b> Where Sam is due next is why he opens this screen; past classes sit below as history (B2.3).<\/div><\/li>\n<li><span class=\"mk\">2<\/span><div><b>Cancel carries its deadline.<\/b> Free until Wed 6:00 AM, 12 h before the start; later, the booking counts as a No-show (#3).<\/div><\/li>\n<li><span class=\"mk\">3<\/span><div><b>The reminder is on the booking.<\/b> Sam sees when the push comes, 2 h before the start; there is no email in v1 (#4, B2.4).<\/div><\/li>\n<li><span class=\"mk\">4<\/span><div><b>Past shows the door mark.<\/b> Came or No-show is the same mark the desk or Maya set on the roster (B1.4).<\/div><\/li>\n<li><span class=\"mk\">5<\/span><div><b>A late cancel explains itself.<\/b> The No-show says it came from cancelling after the cut-off, so the record is never a surprise (#3).<\/div><\/li>\n<\/ol>\n<div class=\"hr\"><\/div>\n<div class=\"eyebrow\">Stories<\/div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px;\"><span class=\"chip\">B2.3<\/span><span class=\"chip\">B2.4<\/span><\/div>\n<div class=\"eyebrow\">Next<\/div>\n<p class=\"help\">→ M01 Classes this week<\/p>\n<\/aside>\n\n<\/div>\n<\/body><\/html>"}, {"file": "US0-Roadmap.dc.html", "title": "Roadmap", "page": "User stories", "row": "Stories 1", "w": 1640, "h": 1380, "doc": "<!doctype html><html><head><meta charset=\"utf-8\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif&amp;family=Inter:wght@400;500;600;700&amp;display=swap\">\n<style>\nbody{margin:0;background:#E9E7E0;font-family:'Inter',system-ui,-apple-system,sans-serif;color:#0E2F3E}\n*{box-sizing:border-box}\np,h1,h2,h3,h4,ul,ol{margin:0}\nul,ol{padding:0;list-style:none}\na{color:#0E2F3E}a:hover{color:#4E5514}\nbutton{font-family:inherit;cursor div>\n    <div style=\"display: flex; gap: 28px; align-items: baseline;\">\n      <div><span class=\"serif tnum\" style=\"font-size: 30px;\">4<\/span> <span class=\"muted\" style=\"font-size: 13px;\">stories<\/span><\/div>\n      <div><span class=\"serif tnum\" style=\"font-size: 30px;\">7<\/span> <span class=\"muted\" style=\"font-size: 13px;\">effort points (S 1 · M 2 · L 3)<\/span><\/div>\n    <\/div>\n  <\/aside>\n<\/header><section style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: start;\"><article class=\"card\" style=\"padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px;\">\n  <div style=\"display: flex; align-items: center; gap: 6px; flex-wrap: wrap;\"><span class=\"chip chip-ink\">B1.1<\/span><span class=\"chip chip-muted\" title=\"Relative effort\">M<\/span><span style=\"flex-grow: 1;\"><\/span><span class=\"chip\"><span class=\"dot\" style=\"background: #0E2F3E;\"><\/span>Web<\/span><\/div>\n  <h3 style=\"font-size: 17px; line-height: 1.25; font-weight: 700;\">Week schedule<\/h3>\n  <p style=\"font-size: 13.5px; line-height: 1.5; color: #33454E;\">As a <b>front desk<\/b>, I want one schedule screen for the whole week, so that I can see every class, wall and coach at once.<\/p>\n  <ul style=\"display: flex; flex-direction: column; gap: 6px;\"><li style=\"display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>Seven days by wall, with draft and published classes told apart<\/span><\/li><li style=\"display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>Opens on the current week<\/span><\/li><\/ul>\n<\/article><article class=\"card\" style=\"padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px;\">\n  <div style=\"display: flex; align-items: center; gap: 6px; flex-wrap: wrap;\"><span class=\"chip chip-ink\">B1.2<\/span><span class=\"chip chip-muted\" title=\"Relative effort\">M<\/span><span class=\"chip chip-muted tnum\">#2<\/span><span style=\"flex-grow: 1;\"><\/span><span class=\"chip\"><span class=\"dot\" style=\"background: #0E2F3E;\"><\/span>Web<\/span><\/div>\n  <h3 style=\"font-size: 17px; line-height: 1.25; font-weight: 700;\">Copy last week<\/h3>\n  <p style=\"font-size: 13.5px; line-height: 1.5; color: #33454E;\">As a <b>front desk<\/b>, I want to copy last week&#x27;s classes as drafts, so that I don&#x27;t rebuild the same week by hand.<\/p>\n  <ul style=\"display: flex; flex-direction: column; gap: 6px;\"><li style=\"display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>Copies as drafts, never published<\/span><\/li><li style=\"display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>A coach or wall clash is flagged on the class, never silently moved<\/span><\/li><\/ul>\n<\/article><article class=\"card\" style=\"padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px;\">\n  <div style=\"display: flex; align-items: center; gap: 6px; flex-wrap: wrap;\"><span class=\"chip chip-ink\">B1.3<\/span><span class=\"chip chip-muted\" title=\"Relative effort\">S<\/span><span style=\"flex-grow: 1;\"><\/span><span class=\"chip\"><span class=\"dot\" style=\"background: #0E2F3E;\"><\/span>Web<\/span><\/div>\n  <h3 style=\"font-size: 17px; line-height: 1.25; font-weight: 700;\">Publish<\/h3>\n  <p style=\"font-size: 13.5px; line-height: 1.5; color: #33454E;\">As a <b>front desk<\/b>, I want to publish drafts in one press, so that members can book them.<\/p>\n  <ul style=\"display: flex; flex-direction: column; gap: 6px;\"><li style=\"display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>Publishing counts the drafts it will publish<\/span><\/li><li style=\"display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>A class with a clash can&#x27;t be published<\/span><\/li><\/ul>\n<\/article><article class=\"card\" style=\"padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px;\">\n  <div style=\"display: flex; align-items: center; gap: 6px; flex-wrap: wrap;\"><span class=\"chip chip-ink\">B1.4<\/span><span class=\"chip chip-muted\" title=\"Relative effort\">M<\/span><span style=\"flex-grow: 1;\"><\/span><span class=\"chip\"><span class=\"dot\" style=\"background: #0E2F3E;\"><\/span>Web<\/span><\/div>\n  <h3 style=\"font-size: 17px; line-height: 1.25; font-weight: 700;\">Check in at the door<\/h3>\n  <p style=\"font-size: 13.5px; line-height: 1.5; color: #33454E;\">As a <b>front desk<\/b>, I want to tick members off the roster, so that the coach starts on time.<\/p>\n  <ul style=\"display: flex; flex-direction: column; gap: 6px;\"><li style=\"display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>Came and No-show per member<\/span><\/li><li style=\"display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>The coach&#x27;s app shows the same marks<\/span><\/li><\/ul>\n<\/article><\/section><div class=\"muted\" style=\"font-size: 13px;\">Surfaces: <span class=\"chip\"><span class=\"dot\" style=\"background: #0E2F3E;\"><\/span>Web<\/span> <span class=\"chip\"><span class=\"dot\" style=\"background: #8FA123;\"><\/span>App<\/span> · Stories are in build order. #n = decision number in the Decisions log.<\/div>\n<\/div>\n<\/body><\/html>"}, {"file": "US2-B2.dc.html", "title": "B2 · Members book", "page": "User stories", "row": "Stories 1", "w": 1640, "h": 860, "doc": "<!doctype html><html><head><meta charset=\"utf-8\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif&amp;family=Inter:wght@400;500;600;700&amp;display=swap\">\n<style>\nbody{margin:0;background:#E9E7E0;font-family:'Inter',system-ui,-apple-system,sans-serif;color:#0E2F3E}\n*{box-sizing:border-box}\np,h1,h2,h3,h4,ul,ol{margin:0}\nul,ol{padding:0;list-style:none}\na{color:#0E2F3E}a:hover{color:#4E5514}\nbutton{fo r\"><\/div>\n    <div><div class=\"eyebrow\">Screens<\/div><p style=\"font-size: 14px; margin-top: 4px;\">W02 · M01 · M02 · M03<\/p><\/div>\n    <div class=\"hr\"><\/div>\n    <div style=\"display: flex; gap: 28px; align-items: baseline;\">\n      <div><span class=\"serif tnum\" style=\"font-size: 30px;\">4<\/span> <span class=\"muted\" style=\"font-size: 13px;\">stories<\/span><\/div>\n      <div><span class=\"serif tnum\" style=\"font-size: 30px;\">7<\/span> <span class=\"muted\" style=\"font-size: 13px;\">effort points (S 1 · M 2 · L 3)<\/span><\/div>\n    <\/div>\n  <\/aside>\n<\/header><section style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: start;\"><article class=\"card\" style=\"padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px;\">\n  <div style=\"display: flex; align-items: center; gap: 6px; flex-wrap: wrap;\"><span class=\"chip chip-ink\">B2.1<\/span><span class=\"chip chip-muted\" title=\"Relative effort\">M<\/span><span style=\"flex-grow: 1;\"><\/span><span class=\"chip\"><span class=\"dot\" style=\"background: #8FA123;\"><\/span>App<\/span><\/div>\n  <h3 style=\"font-size: 17px; line-height: 1.25; font-weight: 700;\">Browse classes<\/h3>\n  <p style=\"font-size: 13.5px; line-height: 1.5; color: #33454E;\">As a <b>member<\/b>, I want to see this week&#x27;s classes by level, so that I find one that fits.<\/p>\n  <ul style=\"display: flex; flex-direction: column; gap: 6px;\"><li style=\"display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>Level chips and a day strip<\/span><\/li><li style=\"display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>Places left on every card; Full when none<\/span><\/li><\/ul>\n<\/article><article class=\"card\" style=\"padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px;\">\n  <div style=\"display: flex; align-items: center; gap: 6px; flex-wrap: wrap;\"><span class=\"chip chip-ink\">B2.2<\/span><span class=\"chip chip-muted\" title=\"Relative effort\">L<\/span><span class=\"chip chip-muted tnum\">#1<\/span><span class=\"chip chip-muted tnum\">#3<\/span><span style=\"flex-grow: 1;\"><\/span><span class=\"chip\"><span class=\"dot\" style=\"background: #8FA123;\"><\/span>App<\/span><span class=\"chip\"><span class=\"dot\" style=\"background: #0E2F3E;\"><\/span>Web<\/span><\/div>\n  <h3 style=\"font-size: 17px; line-height: 1.25; font-weight: 700;\">Book a place<\/h3>\n  <p style=\"font-size: 13.5px; line-height: 1.5; color: #33454E;\">As a <b>member<\/b>, I want to book a place in one tap, so that I&#x27;m sure I&#x27;m in.<\/p>\n  <ul style=\"display: flex; flex-direction: column; gap: 6px;\"><li style=\"display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>The cancel cut-off is shown before booking (#3)<\/span><\/li><li style=\"display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>Capacity is a hard cap for members (#1)<\/span><\/li><li style=\"display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>The desk can book on a member&#x27;s behalf<\/span><\/li><\/ul>\n<\/article><article class=\"card\" style=\"padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px;\">\n  <div style=\"display: flex; align-items: center; gap: 6px; flex-wrap: wrap;\"><span class=\"chip chip-ink\">B2.3<\/span><span class=\"chip chip-muted\" title=\"Relative effort\">S<\/span><span style=\"flex-grow: 1;\"><\/span><span class=\"chip\"><span class=\"dot\" style=\"background: #8FA123;\"><\/span>App<\/span><\/div>\n  <h3 style=\"font-size: 17px; line-height: 1.25; font-weight: 700;\">My bookings<\/h3>\n  <p style=\"font-size: 13.5px; line-height: 1.5; color: #33454E;\">As a <b>member<\/b>, I want my upcoming and past classes in one list, so that I know where I&#x27;m due.<\/p>\n  <ul style=\"display: flex; flex-direction: column; gap: 6px;\"><li style=\"display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>Upcoming first, with Cancel until the cut-off<\/span><\/li><li style=\"display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/ ap: 28px; align-items: baseline;\">\n      <div><span class=\"serif tnum\" style=\"font-size: 30px;\">1<\/span> <span class=\"muted\" style=\"font-size: 13px;\">stories<\/span><\/div>\n      <div><span class=\"serif tnum\" style=\"font-size: 30px;\">3<\/span> <span class=\"muted\" style=\"font-size: 13px;\">effort points (S 1 · M 2 · L 3)<\/span><\/div>\n    <\/div>\n  <\/aside>\n<\/header><section style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: start;\"><article class=\"card\" style=\"padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px;\">\n  <div style=\"display: flex; align-items: center; gap: 6px; flex-wrap: wrap;\"><span class=\"chip chip-ink\">B4.1<\/span><span class=\"chip chip-muted\" title=\"Relative effort\">L<\/span><span style=\"flex-grow: 1;\"><\/span><span class=\"chip\"><span class=\"dot\" style=\"background: #8FA123;\"><\/span>App<\/span><\/div>\n  <h3 style=\"font-size: 17px; line-height: 1.25; font-weight: 700;\">Class packs<\/h3>\n  <p style=\"font-size: 13.5px; line-height: 1.5; color: #33454E;\">As a <b>member<\/b>, I want to buy ten classes at once, so that each class costs less.<\/p>\n  <ul style=\"display: flex; flex-direction: column; gap: 6px;\"><li style=\"display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\/path><\/svg><span>Needs online payment first<\/span><\/li><\/ul>\n<\/article><\/section><div class=\"muted\" style=\"font-size: 13px;\">Surfaces: <span class=\"chip\"><span class=\"dot\" style=\"background: #0E2F3E;\"><\/span>Web<\/span> <span class=\"chip\"><span class=\"dot\" style=\"background: #8FA123;\"><\/span>App<\/span> · Stories are in build order. #n = decision number in the Decisions log.<\/div>\n<\/div>\n<\/body><\/html>"}]</script>
<script>
const items = JSON.parse(document.getElementById("boards").textContent);
const measured = {};
const pages = [...new Set(items.map((i) => i.page))];
let current = pages[0];

function extent(el, clip, top) {
  let max = 0;
  for (const c of el.children) {
    const r = c.getBoundingClientRect();
    const cs = getComputedStyle(c);
    if (r.width > 0 || r.height > 0) max = Math.max(max, Math.min(r.bottom, clip) - top);
    const clips = cs.overflowY !== "visible" || cs.overflow !== "visible";
    max = Math.max(max, extent(c, clips ? Math.min(clip, r.bottom) : clip, top));
  }
  return max;
}

function fit(iframe, item, scale, wrap, cap) {
  const doc = iframe.contentDocument;
  const board = doc && doc.querySelector(".board");
  if (!board) return;
  const top = board.getBoundingClientRect().top;
  const pad = Math.max(parseFloat(getComputedStyle(board).paddingBottom) || 0, 32);
  const need = Math.ceil(extent(board, Infinity, top) + pad);
  measured[item.file] = need;
  const shown = Math.max(item.h, need);
  board.style.height = shown + "px";
  iframe.style.height = shown + "px";
  wrap.style.height = shown * scale + "px";
  if (need > item.h) cap.insertAdjacentHTML("beforeend", ` <span class="bad">clipped by ${need - item.h}px</span>`);
}

function boardFrame(item, scale, cap) {
  const wrap = document.createElement("div");
  wrap.className = "frame";
  wrap.style.width = item.w * scale + "px";
  wrap.style.height = item.h * scale + "px";
  const iframe = document.createElement("iframe");
  iframe.title = item.title;
  iframe.setAttribute("sandbox", "allow-same-origin");
  iframe.style.width = item.w + "px";
  iframe.style.height = item.h + "px";
  iframe.style.transform = `scale(${scale})`;
  iframe.addEventListener("load", () => fit(iframe, item, scale, wrap, cap));
  iframe.srcdoc = item.doc;
  wrap.append(iframe);
  return wrap;
}

function render() {
  const scale = parseFloat(document.getElementById("zoom").value);
  const main = document.getElementById("main");
  main.replaceChildren();
  let rowTitle = null;
  let row = null;
  for (const item of items.filter((i) => i.page === current)) {
    if (item.row !== rowTitle) {
      rowTitle = item.row;
      const h2 = document.createElement("h2");
      h2.textContent = rowTitle;
      row = document.createElement("div");
      row.className = "row";
      main.append(h2, row);
    }
    const thumb = document.createElement("button");
    thumb.type = "button";
    thumb.className = "thumb";
    thumb.style.background = "transparent";
    thumb.style.border = "0";
    thumb.style.padding = "0";
    thumb.setAttribute("aria-label", `Open ${item.title}`);
    const cap = document.createElement("span");
    cap.className = "cap";
    cap.textContent = `${item.title} · ${item.w}×${item.h}`;
    thumb.append(boardFrame(item, scale, cap), cap);
    thumb.addEventListener("click", () => openBoard(item));
    row.append(thumb);
  }
  for (const b of document.querySelectorAll("#tabs button")) b.setAttribute("aria-selected", String(b.dataset.page === current));
}

function openBoard(item) {
  const body = document.getElementById("dlg-body");
  body.replaceChildren();
  const cap = document.createElement("span");
  const scale = Math.min(1, (Math.min(window.innerWidth * 0.96, 1700) - 4) / item.w);
  body.append(boardFrame(item, scale, cap));
  document.getElementById("dlg-title").textContent = item.title;
  document.getElementById("dlg").showModal();
}

function showHeights() {
  const out = {};
  for (const item of items) {
    const need = measured[item.file];
    if (need && Math.abs(need - item.h) >= 20) out[item.file.replace(/\.dc\.html$/, "")] = need;
  }
  const body = document.getElementById("dlg-body");
  const unseen = items.filter((i) => !(i.file in measured)).length;
  body.innerHTML = `<div class="pad"><p>Boards whose height is off by 20px or more, as measured here. Paste this into <code>fit.py</code>. ${unseen ? `<b>${unseen} boards not measured yet: open every page first.</b>` : "Every board measured."}</p><textarea readonly aria-label="Heights JSON"></textarea></div>`;
  body.querySelector("textarea").value = JSON.stringify(out, null, 1);
  document.getElementById("dlg-title").textContent = "Board heights";
  document.getElementById("dlg").showModal();
}

const tabs = document.getElementById("tabs");
for (const p of pages) {
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("role", "tab");
  b.dataset.page = p;
  b.textContent = p;
  b.addEventListener("click", () => { current = p; render(); });
  tabs.append(b);
}
document.getElementById("zoom").addEventListener("change", render);
document.getElementById("heights").addEventListener("click", showHeights);
document.getElementById("dlg-close").addEventListener("click", () => document.getElementById("dlg").close());
render();
</script>
</body>
